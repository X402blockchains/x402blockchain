name: Listing metadata

on:
  pull_request:
    paths:
      - 'listings/prepared/**'
      - 'scripts/check_listing_metadata.py'
      - 'tests/test_listing_metadata.py'
      - '.github/workflows/listing-metadata.yml'
  push:
    branches: [main]
    paths:
      - 'listings/prepared/**'
      - 'scripts/check_listing_metadata.py'
      - 'tests/test_listing_metadata.py'
      - '.github/workflows/listing-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate prepared listings
        run: python3 scripts/check_listing_metadata.py
      - name: Run validation tests
        run: python3 -m unittest discover -s tests -v
